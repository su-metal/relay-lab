name: Fix S8VM-05024 verification errors

on:
  push:
    branches: [feature/omron-s8vm-05024]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/omron-s8vm-05024
      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found: {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/circuit/engine/graph.ts",
              '''    case "terminal":\n    case "power":\n    case "lamp":''',
              '''    case "terminal":\n    case "power":\n    case "ac-dc-power-supply":\n    case "lamp":'''
          )

          replace_once(
              "src/circuit/definitions/__tests__/registry.test.ts",
              '''  it("24 定義が登録されている", () => {''',
              '''  it("25 定義が登録されている", () => {'''
          )
          replace_once(
              "src/circuit/definitions/__tests__/registry.test.ts",
              '''      "power-dc24v",\n      "power-ac100v",\n      "switch-pushbutton-no",''',
              '''      "power-dc24v",\n      "power-ac100v",\n      "omron-s8vm-05024",\n      "switch-pushbutton-no",'''
          )
          replace_once(
              "src/circuit/definitions/__tests__/registry.test.ts",
              '''    expect(componentRegistry.size).toBe(24);''',
              '''    expect(componentRegistry.size).toBe(25);'''
          )
          replace_once(
              "src/circuit/definitions/__tests__/registry.test.ts",
              '''    expect(listComponentDefinitions()).toHaveLength(24);''',
              '''    expect(listComponentDefinitions()).toHaveLength(25);'''
          )

          old_comment = '''  /**\n   * 実端子番号を持たない汎用部品は検証対象そのものが存在しないので、\n   * 検証済みを名乗ってはいけない（design.md §4.4 / §4.5）。\n   *\n   * 逆向き（実端子番号を持つ ⇒ `verified: true`）は**主張しない**。\n   * 新しい型番は `verified: false` から始めるのが正しい手順で、\n   * そこを縛ると未検証の型番を足せなくなる（CLAUDE.md 設計原則 5）。\n   */\n  it("実端子番号を持たない定義は検証済みを名乗らない", () => {\n    for (const definition of componentDefinitions) {\n      const hasRealNumbers = definition.terminals.some(\n        (t) => t.number !== undefined,\n      );\n      if (hasRealNumbers) continue;\n      expect(definition.verified, definition.id).toBe(false);\n    }\n  });'''
          new_comment = '''  /**\n   * 実型番を持たない汎用部品は検証対象そのものが存在しないので、\n   * 検証済みを名乗ってはいけない（design.md §4.4 / §4.5）。\n   *\n   * `number` の有無では判定しない。S8VM の L/N/FG/-V/+V のように、\n   * 実機の端子表示が番号ではなく記号の製品もあるため。\n   * 逆向き（実型番 ⇒ `verified: true`）も主張しない。新しい型番は\n   * 公式資料と照合するまで false のままでよい（CLAUDE.md 設計原則 5）。\n   */\n  it("実型番を持たない汎用部品は検証済みを名乗らない", () => {\n    for (const definition of componentDefinitions) {\n      if (definition.manufacturer) continue;\n      expect(definition.verified, definition.id).toBe(false);\n    }\n  });'''
          replace_once("src/circuit/definitions/__tests__/registry.test.ts", old_comment, new_comment)

          replace_once(
              "src/circuit/definitions/__tests__/registry.test.ts",
              '''      const referenced: string[] =\n        electrical.kind === "power"\n          ? [electrical.positiveTerminal, electrical.zeroTerminal]\n          : electrical.kind === "switch"''',
              '''      const referenced: string[] =\n        electrical.kind === "power"\n          ? [electrical.positiveTerminal, electrical.zeroTerminal]\n          : electrical.kind === "ac-dc-power-supply"\n            ? [\n                electrical.lineTerminal,\n                electrical.neutralTerminal,\n                electrical.positiveTerminal,\n                electrical.zeroTerminal,\n              ]\n          : electrical.kind === "switch"'''
          )

          replace_once(
              "src/lib/__tests__/component-search.test.ts",
              '''    expect(ids("omron")).toEqual([\n      "omron-my2n-dc24",''',
              '''    expect(ids("omron")).toEqual([\n      "omron-s8vm-05024",\n      "omron-my2n-dc24",'''
          )

          # Remove first verification artifacts; final verification is run separately.
          for name in [
              "artifacts/s8vm-verification.txt",
              "artifacts/s8vm-typecheck.log",
              "artifacts/s8vm-test.log",
              "artifacts/s8vm-build.log",
          ]:
              Path(name).unlink(missing_ok=True)
          Path(".github/workflows/fix-s8vm-05024.yml").unlink()

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "S8VM-05024 の型・レジストリ検証を修正"
          git push
