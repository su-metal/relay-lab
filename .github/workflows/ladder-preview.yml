name: ラダー図プレビュー検証

on:
  push:
    branches: [feature/standard-ladder-generator]

jobs:
  preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/standard-ladder-generator

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: 検証とプレビュー生成
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          npm run typecheck > artifacts/typecheck.log 2>&1
          TYPECHECK=$?
          npm test > artifacts/test.log 2>&1
          TEST=$?
          npm run build > artifacts/build.log 2>&1
          BUILD=$?
          set -e

          printf 'typecheck=%s\ntest=%s\nbuild=%s\n' "$TYPECHECK" "$TEST" "$BUILD" > artifacts/verification.txt

          if [ "$TYPECHECK" -eq 0 ] && [ "$TEST" -eq 0 ] && [ "$BUILD" -eq 0 ]; then
            npm run dev > artifacts/dev-server.log 2>&1 &
            DEV_PID=$!
            trap 'kill $DEV_PID 2>/dev/null || true' EXIT
            for i in {1..60}; do
              if curl -fsS http://127.0.0.1:3000 >/dev/null; then break; fi
              sleep 1
            done
            if command -v google-chrome >/dev/null 2>&1; then
              CHROME_BIN="$(command -v google-chrome)" node scripts/capture-ladder-preview.mjs >> artifacts/capture.log 2>&1 || echo 'capture=1' >> artifacts/verification.txt
            else
              echo 'capture=chrome-not-found' >> artifacts/verification.txt
            fi
          fi

      - name: 検証結果をブランチへ保存
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: ラダー図プレビュー検証結果 [skip ci]"
          git push
