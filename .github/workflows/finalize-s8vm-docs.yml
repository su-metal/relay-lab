# S8VM final verification
name: Finalize S8VM docs and verify

on:
  push:
    branches: [feature/omron-s8vm-05024]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, 'S8VMドキュメント整合を完了') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/omron-s8vm-05024
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply documentation consistency fixes
        run: python .github/scripts/finalize_s8vm_docs.py
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified final state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/finalize_s8vm_docs.py .github/workflows/finalize-s8vm-docs.yml
          git add -A
          git commit -m "S8VMドキュメント整合を完了"
          git push
