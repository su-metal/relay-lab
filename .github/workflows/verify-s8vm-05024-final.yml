name: Verify S8VM-05024 final

on:
  push:
    branches: [feature/omron-s8vm-05024]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/omron-s8vm-05024
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run checks
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          npm run typecheck > artifacts/s8vm-typecheck.log 2>&1
          TYPECHECK=$?
          npm test > artifacts/s8vm-test.log 2>&1
          TEST=$?
          npm run build > artifacts/s8vm-build.log 2>&1
          BUILD=$?
          set -e
          printf 'typecheck=%s\ntest=%s\nbuild=%s\n' "$TYPECHECK" "$TEST" "$BUILD" > artifacts/s8vm-verification.txt
          rm .github/workflows/verify-s8vm-05024-final.yml
      - name: Save results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: S8VM-05024 最終検証結果 [skip ci]"
          git push
