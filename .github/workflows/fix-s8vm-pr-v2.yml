name: Apply S8VM repair v2

on:
  pull_request:
    branches: [dev_v0.1]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feature/omron-s8vm-05024' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/omron-s8vm-05024
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply repair
        env:
          REPAIR_B64: "·エンジンを触らない。端子IC8gMFYg端子 ,·"
        run: |
          python - <<'PY'
          import os, base64
          open('/tmp/repair.py','wb').write(base64.b64decode(os.environ['REPAIR_B64']))
          PY
          python /tmp/repair.py
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-s8vm-integration.yml .github/workflows/fix-s8vm-pr.yml .github/workflows/fix-s8vm-pr-v2.yml
          git add -A
          git commit -m "S8VM-05024 の仕様整合と統合を修正"
          git push
