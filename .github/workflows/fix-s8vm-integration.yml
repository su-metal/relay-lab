          section_418 = '''
### 4.18 OMRON S8VM-05024（AC-DC スイッチング電源）

`omron-s8vm-05024` は OMRON 公式 S8VM 資料で照合した実型番。オープン・底面取りつけの 50W / DC24V 2.2A タイプで、定格入力は AC100〜240V、使用可能範囲は AC85〜265V。端子は実機表示どおり `L` / `N` / `FG` / `-V` / `+V` を持つ。Nomenclature の 1 / 2 / 3 は説明項目番号なので端子番号として保存せず、`TerminalDefinition.number` には実機の刻印 `L` / `N` / `FG` / `-V` / `+V` をそのまま入れる。

出典は OMRON 公式の「形式/種類」「定格/性能」「配線/接続 > 形S8VM-050□□□□（50W）ブロック図」。一次側 L/N と二次側 -V/+V は絶縁され、`conductingPairs()` では union しない。FG は保護接地用の実端子だが、現行エンジンは接地系統そのものを解かないため電位源にはしない。

`ElectricalDefinition.kind = "ac-dc-power-supply"` は型番固有の分岐ではなく、今後の同種 AC-DC 電源が共有する振る舞い。公式の入力電圧範囲は定義に保持するが、§4.13 の「定格電圧不一致を一般判定しない」方針を維持するため、現行の ON/OFF 判定は L/N が**同じ AC 電源の両端**へ届くかだけを見る。

'''
          if '### 4.18 OMRON S8VM-05024' not in text:
              marker = '\n## 5. '
              idx = text.find(marker)
              if idx < 0:
                  raise SystemExit("design ##5 marker not found")
              text = text[:idx] + '\n' + section_418 + text[idx:]

          section_520 = '''
### 5.20 AC-DC 電源の電位生成

`computeNetStates()` はまず従来の `kind: "power"` とダイオード/調光器の有向伝搬を解き、その結果から `kind: "ac-dc-power-supply"` の L/N を確認する。同じ AC 電源 ID の両極が L/N に届いていれば、その AC-DC 電源自身の component ID を +V 側の `plusFrom` と -V 側の `zeroFrom` に追加する。一次側と二次側を union しないので絶縁は保たれ、既存の「同じ電源 ID の両端で負荷を判定する」規則も変えない。

経路グラフ（§5.9〜§5.11）はエンジンの `NetState` を読み、実際に出力が成立している AC-DC 電源だけを電源端点として扱う。ラダー図（§5.16）は瞬時状態ではなく回路トポロジーなので、AC 入力の現在状態に関係なく +V/-V を DC 側の母線として扱う。これによりシミュレーション表示とラダー図の役割を混同しない。

入力の定格/使用可能電圧範囲は定義データとして保持するが、§4.13 の既存スコープに従い電圧不一致を動作判定・警告には使わない。将来、電圧適合性を扱う場合は S8VM だけの例外ではなく `power` / 負荷を含む全体仕様として別スコープで追加する。

'''
          if '### 5.20 AC-DC 電源の電位生成' not in text:
              marker = '\n## 6. '
              idx = text.find(marker)
              if idx < 0:
                  raise SystemExit("design ##6 marker not found")
              text = text[:idx] + '\n' + section_520 + text[idx:]
          p.write_text(text)

      - name: Run typecheck tests and build
        shell: bash
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-s8vm-integration.yml
          git add -A
          git commit -m "S8VM-05024 の仕様整合と統合を修正"
          git push
