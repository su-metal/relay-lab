          new = 'MY2N / MY4N / MY4N-D2 は OMRON 公式データシート（J199）と照合済み、G7L-1A-B / G7L-2A-B は公式カタログ（CDPA-041C）と照合済み、S8VM-05024 は OMRON 公式 S8VM の「形式/種類」「定格/性能」「配線/接続 > 形S8VM-050□□□□（50W）ブロック図」と照合済みで `verified: true`（`design.md` §4.4・§4.9・§4.18）。S8VM の L/N/FG/-V/+V のように端子表示が数字でない場合も、実機の刻印を `number` にそのまま保持する。'
          if old not in text:
              raise SystemExit("CLAUDE principle 5 anchor not found")
          p.write_text(text.replace(old, new, 1))

          # 10) Product requirements: supported component list + explicit simulation boundary.
          p = Path("requirements_definition.md")
          text = p.read_text()
          old = '| 電源 | DC24V 電源（+24V 端子 / 0V 端子）/ AC100V 電源（L 端子 / N 端子） |'
          new = '| 電源 | DC24V 電源（+24V 端子 / 0V 端子）/ AC100V 電源（L 端子 / N 端子）/ OMRON S8VM-05024（AC入力 L/N・FG・DC出力 -V/+V） |'
          if old not in text:
              raise SystemExit("requirements power row anchor not found")
          text = text.replace(old, new, 1)
          anchor = 'AC 電源は**交流として扱わない。** 位相・実効値・力率は再現せず、L と N は電位差の両端としてのみ扱う。定格電圧の不一致（AC100V の回路に DC24V のランプなど）も検出しない（`design.md` §4.13）。'
          addition = '''OMRON S8VM-05024 は**実型番の AC-DC スイッチング電源**として扱う。実機端子表示は L / N / FG / -V / +V、定格入力 AC100〜240V（使用可能範囲 AC85〜265V）、出力 DC24V・2.2A・50W。シミュレーションでは L/N が同じ AC 電源の両端へ届いたときだけ +V/-V に DC 電源を成立させ、一次側と二次側は内部で導通させない。入力電圧範囲は仕様情報として保持するが、既存方針どおり**定格電圧不一致の一般判定は行わない**。効率・リップル・V.ADJ・過電流/過電圧保護などは現スコープ外（`design.md` §4.18・§5.20）。

'''
          if anchor not in text:
              raise SystemExit("requirements AC paragraph anchor not found")
          text = text.replace(anchor, addition + anchor, 1)
          p.write_text(text)

          # 11) design.md: keep type/definition/engine documentation fresh as CLAUDE.md requires.
          p = Path("design.md")
          text = p.read_text()
          dir_anchor = '        g7l-2a-b-dc24.ts\n      power.ts'
          if dir_anchor in text:
              text = text.replace(dir_anchor, '        g7l-2a-b-dc24.ts\n        s8vm-05024.ts           # S8VM-05024（AC→DC電源・§4.18）\n      power.ts', 1)

          type_anchor = '''  | { kind: "power";  voltage: number; currentType: "DC" | "AC";
      positiveTerminal: string; zeroTerminal: string }'''
          type_add = '''  | { kind: "power";  voltage: number; currentType: "DC" | "AC";
      positiveTerminal: string; zeroTerminal: string }
  | { kind: "ac-dc-power-supply";
      ratedInputVoltageMin: number; ratedInputVoltageMax: number;
      allowableInputVoltageMin: number; allowableInputVoltageMax: number;
