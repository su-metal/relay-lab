name: Fix S8VM-05024 integration

on:
  push:
    branches: [feature/omron-s8vm-05024]

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/omron-s8vm-05024
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Apply S8VM integration fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) S8VM-05024 definition: official markings + rated/allowable ranges.
          Path("src/circuit/definitions/omron/s8vm-05024.ts").write_text('''import type { ComponentDefinition } from "@/circuit/types";

/**
 * OMRON S8VM-05024 — 50W / DC24V 2.2A、オープン・底面取りつけタイプ。
 *
 * OMRON 公式資料:
 * - 形式/種類: S8VM-05024 = 50W / 24V / 2.2A、オープン・底面取りつけ
 *   https://www.fa.omron.co.jp/products/family/1616/lineup/
 * - 定格/性能: 定格入力 AC100〜240V、使用可能範囲 AC85〜265V
 *   https://www.fa.omron.co.jp/products/family/1616/specification/
 * - 配線/接続: 「形S8VM-050□□□□（50W）」ブロック図
 *   https://www.fa.omron.co.jp/products/family/1616/network/
 *
 * 実機の端子表示は L / N / FG / -V / +V。Nomenclature の 1 / 2 / 3 は
 * 「AC入力」「FG」「DC出力」という説明項目番号で、物理端子番号ではない。
 * `number` には実機に刻印される端子記号そのものを保持する。
 */
export const S8VM_05024_SOURCE =
  "https://www.fa.omron.co.jp/products/family/1616/network/";

export const omronS8vm05024: ComponentDefinition = {
  id: "omron-s8vm-05024",
  manufacturer: "OMRON",
  model: "S8VM-05024",
  category: "power",
  terminals: [
    {
      id: "L",
      label: "L",
      number: "L",
      role: "power_line",
      description: "AC入力 L / 定格AC100〜240V（使用可能範囲AC85〜265V）",
      position: { x: 0, y: 0.25 },
      side: "left",
    },
    {
      id: "N",
      label: "N",
      number: "N",
      role: "power_neutral",
      description: "AC入力 N / 定格AC100〜240V（使用可能範囲AC85〜265V）",
      position: { x: 0, y: 0.48 },
      side: "left",
    },
    {
      id: "FG",
      label: "FG",
      number: "FG",
      role: "generic",
      description: "FG / フレームグラウンド端子（保護接地）",
      position: { x: 0.5, y: 1 },
      side: "bottom",
    },
    {
      id: "-V",
      label: "-V",
      number: "-V",
      role: "power_zero",
      description: "DC出力 -V / DC24V",
      position: { x: 1, y: 0.62 },
      side: "right",
    },
    {
      id: "+V",
      label: "+V",
      number: "+V",
      role: "power_positive",
      description: "DC出力 +V / DC24V・定格2.2A",
      position: { x: 1, y: 0.34 },
      side: "right",
    },
  ],
  electrical: {
    kind: "ac-dc-power-supply",
    ratedInputVoltageMin: 100,
    ratedInputVoltageMax: 240,
    allowableInputVoltageMin: 85,
    allowableInputVoltageMax: 265,
    lineTerminal: "L",
    neutralTerminal: "N",
    outputVoltage: 24,
    positiveTerminal: "+V",
    zeroTerminal: "-V",
    ratedOutputCurrent: 2.2,
    ratedPower: 50,
  },
  visual: { width: 200, height: 180 },
  source: S8VM_05024_SOURCE,
  verified: true,
};
''')

          # 2) ElectricalDefinition: keep official ranges as metadata.
          p = Path("src/circuit/types/component.ts")
          text = p.read_text()
          old = '''  | {
      kind: "ac-dc-power-supply";
      inputVoltageMin: number;
      inputVoltageMax: number;
      lineTerminal: string;
      neutralTerminal: string;
      outputVoltage: number;
      positiveTerminal: string;
      zeroTerminal: string;
      ratedOutputCurrent?: number;
      ratedPower?: number;
    }'''
          new = '''  | {
      kind: "ac-dc-power-supply";
      /** メーカーの定格入力範囲。現行シミュレータでは電圧不一致判定には使わない */
      ratedInputVoltageMin: number;
      ratedInputVoltageMax: number;
      /** メーカーが示す使用可能な入力電圧範囲（仕様表示用） */
      allowableInputVoltageMin: number;
      allowableInputVoltageMax: number;
      lineTerminal: string;
      neutralTerminal: string;
      outputVoltage: number;
      positiveTerminal: string;
      zeroTerminal: string;
      ratedOutputCurrent?: number;
      ratedPower?: number;
    }'''
          if old not in text:
              raise SystemExit("ac-dc type block not found")
          p.write_text(text.replace(old, new, 1))

          # 3) Engine: AC voltage mismatch remains out of scope. Same AC source on L/N is enough.
          p = Path("src/circuit/engine/graph.ts")
          text = p.read_text()
          pattern = re.compile(r'''  const compatibleAcSource = \(sourceId: string, min: number, max: number\): boolean => \{.*?\n  \};''', re.S)
          replacement = '''  const isAcSource = (sourceId: string): boolean => {
    const source = instanceById.get(sourceId);
    if (!source) return false;
    const sourceElectrical = definitions.get(source.definitionId)?.electrical;
    return sourceElectrical?.kind === "power" && sourceElectrical.currentType === "AC";
  };'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("compatibleAcSource block not found")
          text = text.replace(
              "compatibleAcSource(sourceId, electrical.inputVoltageMin, electrical.inputVoltageMax)",
              "isAcSource(sourceId)",
          )
          text = text.replace(
              "// AC-DC 電源は、L/N が同じ適合 AC 電源の両極へ届いたときだけ DC 出力を持つ。",
              "// AC-DC 電源は、L/N が同じ AC 電源の両極へ届いたときだけ DC 出力を持つ。\n  // 電圧範囲は仕様データとして保持するが、requirements_definition.md §6.1 の\n  // 『定格電圧の不一致は検出しない』に合わせ、ここでは判定条件にしない。",
          )
          p.write_text(text)

          # 4) Path graph: powered AC-DC output must be a supply endpoint for current/path views.
          p = Path("src/circuit/adapter/path-graph.ts")
          text = p.read_text()
          text = text.replace(
              'import { conductingPairs } from "@/circuit/engine";',
              'import { buildNets, computeNetStates, conductingPairs } from "@/circuit/engine";',
              1,
          )
          anchor = '''  for (const connection of document.connections) {
    connect(
      terminalRefKey(connection.from),
      terminalRefKey(connection.to),
      connection.id,
    );
  }

  for (const instance of document.components) {'''
          replacement = '''  for (const connection of document.connections) {
    connect(
      terminalRefKey(connection.from),
      terminalRefKey(connection.to),
      connection.id,
    );
  }

  // AC-DC 電源の二次側は、一次側 L/N に AC が成立しているときだけ電源端点になる。
  // 判定を adapter に書き直さず、エンジンが解いた NetState の source ID を読む。
  const nets = buildNets(
    document,
    definitions,
    { pressedSwitches },
    energizedRelays,
  );
  const states = computeNetStates(document, definitions, nets);

  for (const instance of document.components) {'''
          if anchor not in text:
              raise SystemExit("path graph insertion anchor not found")
          text = text.replace(anchor, replacement, 1)
          anchor = '''    if (electrical.kind === "power") {
      connect(terminalKey(instance.id, electrical.positiveTerminal), PLUS_NODE);
      connect(terminalKey(instance.id, electrical.zeroTerminal), ZERO_NODE);
    }
  }'''
          replacement = '''    if (electrical.kind === "power") {
      connect(terminalKey(instance.id, electrical.positiveTerminal), PLUS_NODE);
      connect(terminalKey(instance.id, electrical.zeroTerminal), ZERO_NODE);
    }

    if (electrical.kind === "ac-dc-power-supply") {
      const plusNet = nets.netOf.get(
        terminalKey(instance.id, electrical.positiveTerminal),
      );
      const zeroNet = nets.netOf.get(
        terminalKey(instance.id, electrical.zeroTerminal),
      );
      const powered =
        plusNet !== undefined &&
        zeroNet !== undefined &&
        states.get(plusNet)?.plusFrom.has(instance.id) === true &&
        states.get(zeroNet)?.zeroFrom.has(instance.id) === true;
      if (powered) {
        connect(terminalKey(instance.id, electrical.positiveTerminal), PLUS_NODE);
        connect(terminalKey(instance.id, electrical.zeroTerminal), ZERO_NODE);
      }
    }
  }'''
          if anchor not in text:
              raise SystemExit("path graph power anchor not found")
          p.write_text(text.replace(anchor, replacement, 1))

          # 5) Ladder is topology, not current state: treat the converter's DC output as rails.
          p = Path("src/circuit/adapter/ladder.ts")
          text = p.read_text()
          text = text.replace(
              '    if (electrical.kind === "power") {',
              '    if (\n      electrical.kind === "power" ||\n      electrical.kind === "ac-dc-power-supply"\n    ) {',
              1,
          )
          text = text.replace(
              '      case "power":\n      case "terminal":',
              '      case "power":\n      case "ac-dc-power-supply":\n      case "terminal":',
              1,
          )
          p.write_text(text)

          # 6) Registry invariant: don't weaken verification just because manufacturer is present.
          p = Path("src/circuit/definitions/__tests__/registry.test.ts")
          text = p.read_text()
          start = text.index('  /**\n   * 実端子を持たない純粋な汎用部品は検証済みを名乗らない。')
          end = text.index('\n\n  it("部品ごとに端子 ID が重複しない"', start)
          block = '''  /**
   * 実端子番号／記号を持たない汎用部品は検証対象そのものが存在しないので、
   * 検証済みを名乗ってはいけない（design.md §4.4 / §4.5）。
   *
   * S8VM の L/N/FG/-V/+V のように数字ではない実端子表示も `number` に
   * そのまま保持する。メーカー名があるだけで検証済み扱いにはしない。
   */
  it("実端子番号／記号を持たない定義は検証済みを名乗らない", () => {
    for (const definition of componentDefinitions) {
      const hasRealTerminals = definition.terminals.some(
        (terminal) => terminal.number !== undefined,
      );
      if (hasRealTerminals) continue;
      expect(definition.verified, definition.id).toBe(false);
    }
  });'''
          p.write_text(text[:start] + block + text[end:])

          # 7) S8VM engine tests.
          Path("src/circuit/engine/__tests__/s8vm-05024.test.ts").write_text('''import { describe, expect, it } from "vitest";

import { componentRegistry, omronS8vm05024 } from "@/circuit/definitions";
import { simulate } from "@/circuit/engine";
import type { CircuitConnection, CircuitDocument } from "@/circuit/types";

const wire = (from: string, to: string): CircuitConnection => {
  const [fromComponent, fromTerminal] = from.split(":");
  const [toComponent, toTerminal] = to.split(":");
  return {
    id: `${from}-${to}`,
    from: { componentId: fromComponent, terminalId: fromTerminal },
    to: { componentId: toComponent, terminalId: toTerminal },
  };
};

const makeCircuit = (withInput: boolean): CircuitDocument => ({
  version: 1,
  components: [
    { id: "AC1", definitionId: "power-ac100v", label: "AC1", position: { x: 0, y: 0 } },
    { id: "PS1", definitionId: "omron-s8vm-05024", label: "PS1", position: { x: 200, y: 0 } },
    { id: "PL1", definitionId: "lamp-dc24v", label: "PL1", position: { x: 400, y: 0 } },
  ],
  connections: [
    ...(withInput ? [wire("AC1:L", "PS1:L"), wire("AC1:N", "PS1:N")] : []),
    wire("PS1:+V", "PL1:1"),
    wire("PL1:2", "PS1:-V"),
  ],
  viewport: { x: 0, y: 0, zoom: 1 },
});

describe("OMRON S8VM-05024", () => {
  it("公式仕様の端子表示と定格を保持する", () => {
    expect(omronS8vm05024.manufacturer).toBe("OMRON");
    expect(omronS8vm05024.model).toBe("S8VM-05024");
    expect(omronS8vm05024.terminals.map((terminal) => terminal.id)).toEqual([
      "L", "N", "FG", "-V", "+V",
    ]);
    expect(omronS8vm05024.terminals.map((terminal) => terminal.number)).toEqual([
      "L", "N", "FG", "-V", "+V",
    ]);
    expect(omronS8vm05024.verified).toBe(true);
    expect(omronS8vm05024.electrical).toMatchObject({
      kind: "ac-dc-power-supply",
      ratedInputVoltageMin: 100,
      ratedInputVoltageMax: 240,
      allowableInputVoltageMin: 85,
      allowableInputVoltageMax: 265,
      outputVoltage: 24,
      ratedOutputCurrent: 2.2,
      ratedPower: 50,
    });
  });

  it("同じ AC 電源が L/N に来たときだけ DC24V 出力が有効になる", () => {
    const powered = simulate(makeCircuit(true), componentRegistry, { pressedSwitches: new Set() });
    expect(powered.litLamps.has("PL1")).toBe(true);

    const unpowered = simulate(makeCircuit(false), componentRegistry, { pressedSwitches: new Set() });
    expect(unpowered.litLamps.has("PL1")).toBe(false);
  });

  it("DC 出力短絡を検出する", () => {
    const document = makeCircuit(true);
    document.connections.push(wire("PS1:+V", "PS1:-V"));
    const result = simulate(document, componentRegistry, { pressedSwitches: new Set() });
    expect(result.warnings.some((warning) =>
      warning.code === "power-short-circuit" && warning.componentId === "PS1"
    )).toBe(true);
  });
});
''')

          # 8) Adapter integration tests: path views and ladder must agree with engine/topology.
          Path("src/circuit/adapter/__tests__/s8vm-power-source.test.ts").write_text('''import { describe, expect, it } from "vitest";

import { buildLadder } from "@/circuit/adapter/ladder";
import {
  buildPathGraph,
  PLUS_NODE,
  ZERO_NODE,
  reachableFrom,
} from "@/circuit/adapter/path-graph";
import { componentRegistry } from "@/circuit/definitions";
import type { CircuitConnection, CircuitDocument } from "@/circuit/types";
import { terminalKey } from "@/circuit/types";

const wire = (from: string, to: string): CircuitConnection => {
  const [fromComponent, fromTerminal] = from.split(":");
  const [toComponent, toTerminal] = to.split(":");
  return {
    id: `${from}-${to}`,
    from: { componentId: fromComponent, terminalId: fromTerminal },
    to: { componentId: toComponent, terminalId: toTerminal },
  };
};

const poweredCircuit = (withInput: boolean): CircuitDocument => ({
  version: 1,
  components: [
    { id: "AC1", definitionId: "power-ac100v", position: { x: 0, y: 0 } },
    { id: "PS1", definitionId: "omron-s8vm-05024", position: { x: 180, y: 0 } },
    { id: "PL1", definitionId: "lamp-dc24v", position: { x: 360, y: 0 } },
  ],
  connections: [
    ...(withInput ? [wire("AC1:L", "PS1:L"), wire("AC1:N", "PS1:N")] : []),
    wire("PS1:+V", "PL1:1"),
    wire("PL1:2", "PS1:-V"),
  ],
  viewport: { x: 0, y: 0, zoom: 1 },
});

describe("S8VM-05024 の adapter 統合", () => {
  it("一次側が生きているときだけ経路グラフで二次側を電源として扱う", () => {
    const on = buildPathGraph(poweredCircuit(true), componentRegistry, new Set(), new Set());
    expect(reachableFrom(on, PLUS_NODE).has(terminalKey("PS1", "+V"))).toBe(true);
    expect(reachableFrom(on, ZERO_NODE).has(terminalKey("PS1", "-V"))).toBe(true);

    const off = buildPathGraph(poweredCircuit(false), componentRegistry, new Set(), new Set());
    expect(reachableFrom(off, PLUS_NODE).has(terminalKey("PS1", "+V"))).toBe(false);
    expect(reachableFrom(off, ZERO_NODE).has(terminalKey("PS1", "-V"))).toBe(false);
  });

  it("ラダー図では S8VM の DC 出力を電源母線として扱う", () => {
    const document: CircuitDocument = {
      version: 1,
      components: [
        { id: "PS1", definitionId: "omron-s8vm-05024", position: { x: 0, y: 0 } },
        { id: "PL1", definitionId: "lamp-dc24v", position: { x: 200, y: 0 } },
      ],
      connections: [
        wire("PS1:+V", "PL1:1"),
        wire("PL1:2", "PS1:-V"),
      ],
      viewport: { x: 0, y: 0, zoom: 1 },
    };

    const ladder = buildLadder(document, componentRegistry);
    const lamp = ladder.rungs.find((rung) => rung.output.componentId === "PL1");
    expect(lamp).toBeDefined();
    expect(lamp?.blocked).toBeUndefined();
    expect(lamp?.condition).toBeUndefined();
  });
});
''')

          # 9) CLAUDE.md: clarify extensibility rule and record S8VM verification.
          p = Path("CLAUDE.md")
          text = p.read_text()
          old = '2. **エンジンに型番分岐を書かない。** `if (model === "MY4N")` は禁止。エンジンは `ComponentDefinition` を読んで動作する。新型番の追加が定義ファイル 1 枚で完結すること。'
          new = '2. **エンジンに型番分岐を書かない。** `if (model === "MY4N")` は禁止。エンジンは `ComponentDefinition` を読んで動作する。**既に対応済みの電気的な振る舞いを持つ新型番**の追加が定義ファイル 1 枚で完結すること。新しい物理的な振る舞い（例: AC 入力から DC 出力を作る電源）を初めて導入するときは、型番名ではなく汎用の `ElectricalDefinition.kind` として一度だけエンジンへ追加し、その後の同種型番ではエンジンを触らない。'
          if old not in text:
              raise SystemExit("CLAUDE principle 2 anchor not found")
          text = text.replace(old, new, 1)
